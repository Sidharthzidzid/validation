<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No-Code Syllabus PDF</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #f4f4f4;
      --muted: #b8b8b8;
      --brand: #ff5a1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "DM Sans", sans-serif;
    }
    .wrap {
      width: min(1200px, 94vw);
      margin: 0 auto;
      padding: 20px 0 28px;
    }
    .topbar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .title span { color: var(--brand); }
    .viewer {
      width: 100%;
      min-height: calc(100vh - 110px);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: auto;
      background: #0f0f0f;
      padding: 14px;
    }
    #pdfPages {
      display: grid;
      gap: 14px;
      justify-items: center;
    }
    .pdf-page {
      width: 100%;
      max-width: 950px;
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
      background: #fff;
      display: block;
    }
    .loading {
      color: var(--muted);
      text-align: center;
      padding: 48px 14px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="title">Embedded Syllabus: <span>Introduction No-Code App Development</span></div>
    </div>

    <section class="viewer" aria-label="PDF Viewer">
      <div id="pdfPages">
        <div id="loading" class="loading">Loading syllabus PDF...</div>
      </div>
    </section>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.mjs";

    const pdfPath = "Introdection%20No%20Code%20App%20Development.pdf";
    const pagesWrap = document.getElementById("pdfPages");
    const loadingEl = document.getElementById("loading");

    async function renderPdf() {
      try {
        const pdf = await pdfjsLib.getDocument(pdfPath).promise;
        if (loadingEl) loadingEl.remove();

        for (let p = 1; p <= pdf.numPages; p += 1) {
          const page = await pdf.getPage(p);
          const containerWidth = Math.min(pagesWrap.clientWidth - 8, 950);
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = containerWidth / baseViewport.width;
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement("canvas");
          canvas.className = "pdf-page";
          const context = canvas.getContext("2d", { alpha: false });
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          pagesWrap.appendChild(canvas);
          await page.render({ canvasContext: context, viewport }).promise;
        }
      } catch (err) {
        if (loadingEl) loadingEl.textContent = "Unable to render PDF in this browser.";
      }
    }

    renderPdf();
    window.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
