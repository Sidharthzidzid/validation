<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --success: #22c55e; --error: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        /* Containers */
        .card { background: white; width: 90%; max-width: 400px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; overflow: hidden; display: none; }
        .error-card { background: white; width: 90%; max-width: 400px; border-radius: 24px; padding: 40px 20px; text-align: center; box-shadow: 0 20px 25px rgba(0,0,0,0.05); border: 2px dashed #cbd5e1; display: none; }

        /* Success Styling */
        .header { background: var(--primary); color: white; padding: 25px; text-align: center; font-weight: 700; font-size: 14px; letter-spacing: 2px; }
        .seal { color: var(--success); font-size: 60px; margin: 30px 0 10px; }
        .name { font-size: 26px; font-weight: 700; color: #1e293b; margin: 10px 0; }
        .course { color: #64748b; font-size: 18px; margin-bottom: 30px; }
        .meta { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #f1f5f9; padding: 20px; background: #fdfdfd; }
        .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .value { font-size: 14px; color: var(--primary); font-weight: 600; }

        /* Error Styling */
        .error-icon { color: var(--error); font-size: 60px; margin-bottom: 20px; }
        .error-title { color: #1e293b; font-size: 22px; font-weight: 700; }
        .error-msg { color: #64748b; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- SUCCESS STATE -->
    <div id="successCard" class="card">
        <div class="header">OFFICIAL DIGITAL CREDENTIAL</div>
        <div style="text-align: center;">
            <div class="seal">✓</div>
            <div style="color: var(--success); font-weight: 700; font-size: 12px;">VERIFIED BY SYSTEM</div>
            <div class="name" id="dn"></div>
            <div class="course" id="dc"></div>
        </div>
        <div class="meta">
            <div>
                <div class="label">Issue Date</div>
                <div class="value" id="dd"></div>
            </div>
            <div>
                <div class="label">Credential ID</div>
                <div class="value" id="di" style="color: #2563eb;"></div>
            </div>
        </div>
    </div>

    <!-- ERROR STATE -->
    <div id="errorCard" class="error-card">
        <div class="error-icon">✕</div>
        <div class="error-title">Invalid Credential</div>
        <p class="error-msg">This QR code does not contain a valid security signature or the data has been corrupted.</p>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; border-radius:8px; border:none; background:#f1f5f9; cursor:pointer; font-weight:600;">Try Again</button>
    </div>

    <script>
        // 1. Get data from URL
        const p = new URLSearchParams(window.location.search);
        const name = p.get('n');
        const course = p.get('c');
        const date = p.get('d');
        const id = p.get('id');

        // 2. CHECK: If any critical field is missing, it's NOT a valid certificate
        if (name && course && id) {
            // Show Success
            document.getElementById('successCard').style.display = 'block';
            document.getElementById('dn').innerText = name;
            document.getElementById('dc').innerText = course;
            document.getElementById('dd').innerText = date || 'N/A';
            document.getElementById('di').innerText = id;
        } else {
            // Show Error
            document.getElementById('errorCard').style.display = 'block';
        }
    </script>
</body>
</html>
